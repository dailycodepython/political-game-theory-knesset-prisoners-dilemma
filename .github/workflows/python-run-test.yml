name: Verify Game Theory Simulator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-execution:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository source
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run Coalition Simulator
      run: |
        python coalition_simulator.py
